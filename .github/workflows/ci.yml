name: CI/CD Pipeline & Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ─── 1. Backend Linting & Test Suite ──────────────────────────
  backend-test:
    name: Backend Tests (FastAPI, PostgreSQL & Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rsadmin
          POSTGRES_PASSWORD: support_2026
          POSTGRES_DB: remote_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fastapi_backend/requirements.txt
          pip install pytest httpx ruff

      - name: Lint Backend Code
        run: |
          ruff check fastapi_backend/app --ignore E501,E402 || true

      - name: Run Backend Integration & Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://rsadmin:support_2026@localhost:5432/remote_support
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd fastapi_backend
          python -m tests.test_api

  # ─── 2. Frontend Typecheck & Build ───────────────────────────
  frontend-build:
    name: Frontend Build & Typecheck (Vue 3 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: tauri_agent/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd tauri_agent
          npm ci

      - name: Typecheck and Build Web Client
        run: |
          cd tauri_agent
          npm run build

  # ─── 3. Docker Compose Build Verification ────────────────────
  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Docker Images (Backend & Frontend)
        run: |
          docker compose build --parallel
