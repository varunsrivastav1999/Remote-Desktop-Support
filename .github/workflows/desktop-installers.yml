name: Desktop Installers

# Builds the Tauri desktop app (native input, starts at login, no Python agent needed).
# Run it by hand from the Actions tab; it never runs on push.
on:
  workflow_dispatch:
    inputs:
      signaling_server:
        description: "Signaling server the app connects to, e.g. wss://support.example.com/ws/"
        required: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundles: app,dmg
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            bundles: app,dmg
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri_agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri_agent/src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm install
          # tauri build refuses an @tauri-apps/api whose major.minor differs from the locked tauri crate
          TAURI=$(grep -A1 '^name = "tauri"$' src-tauri/Cargo.lock | sed -n 's/^version = "\([0-9]*\.[0-9]*\).*/\1/p')
          npm install --no-save "@tauri-apps/api@~$TAURI"

      - name: Build installer
        shell: bash
        env:
          VITE_SIGNALING_SERVER: ${{ inputs.signaling_server }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npx tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}
          else
            npx tauri build --bundles ${{ matrix.bundles }}
          fi

      # Installers are unsigned: Windows SmartScreen and macOS Gatekeeper warn on first open
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: |
            tauri_agent/src-tauri/target/**/release/bundle/msi/*.msi
            tauri_agent/src-tauri/target/**/release/bundle/nsis/*.exe
            tauri_agent/src-tauri/target/**/release/bundle/dmg/*.dmg
            tauri_agent/src-tauri/target/**/release/bundle/deb/*.deb
            tauri_agent/src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
