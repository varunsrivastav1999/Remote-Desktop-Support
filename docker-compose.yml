name: remote-desktop-support

services:
  # PostgreSQL Database for Device Registry, Credentials, Sessions, and Audit Logs
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_2026}
      POSTGRES_DB: ${POSTGRES_DB:-remote_support}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsadmin} -d ${POSTGRES_DB:-remote_support}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for real-time presence, temporary signaling pub/sub, and heartbeat TTL
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TURN relay for networks where direct peer-to-peer WebRTC cannot connect
  turn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --realm=${TURN_REALM:-remote-support.local}
      - --user=${TURN_USERNAME:-remote}:${TURN_PASSWORD:-support_2026}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  # FastAPI REST and WebSocket Signaling Server
  backend:
    build: ./fastapi_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rsadmin}:${POSTGRES_PASSWORD:-support_2026}@postgres:5432/${POSTGRES_DB:-remote_support}
      - REDIS_URL=redis://redis:6379/0
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-2592000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Remote Desktop Support Web Controller & Reverse Proxy
  app:
    build: ./tauri_agent
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Public tunnel for Internet access (Supports both Quick Tunnel and Permanent Named Tunnel Token)
  cloudflare_tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: >-
      sh -c '
      if [ -n "$$CLOUDFLARE_TUNNEL_TOKEN" ]; then
        echo "Starting Cloudflare Tunnel with permanent token..."
        exec cloudflared tunnel --no-autoupdate run --token "$$CLOUDFLARE_TUNNEL_TOKEN"
      else
        echo "Starting Cloudflare Quick Tunnel..."
        exec cloudflared tunnel --url http://app:80 --no-autoupdate
      fi
      '
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

  # Automated Git Sync & Container Reload (Keeps repo and services up-to-date automatically without manual git pull)
  auto_updater:
    build:
      context: .
      dockerfile: scripts/Dockerfile.updater
    restart: unless-stopped
    environment:
      - UPDATE_INTERVAL_SECONDS=${UPDATE_INTERVAL_SECONDS:-60}
      - UPDATE_BRANCH=${UPDATE_BRANCH:-main}
      - WORKSPACE_DIR=/workspace
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_healthy

  # Watchtower for auto-updating pre-built registry images
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - DOCKER_API_VERSION=1.44

volumes:
  postgres_data:

